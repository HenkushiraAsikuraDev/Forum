<!DOCTYPE html>
<html>
<head>
  <title>Mini Forum</title>
  <meta charset="UTF-8" />
</head>
<body>

<h2>Mini Forum</h2>

<div>
  <h3>Register</h3>
  <input id="regUser" placeholder="Username">
  <input id="regPass" type="password" placeholder="Password">
  <button onclick="register()">Register</button>
</div>

<div>
  <h3>Login</h3>
  <input id="logUser" placeholder="Username">
  <input id="logPass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<hr>

<div>
  <h3>Create Post</h3>
  <input id="title" placeholder="Title">
  <input id="content" placeholder="Content">
  <button onclick="createPost()">Post</button>
</div>

<hr>

<h3>Posts</h3>
<div id="posts"></div>

<script>
let token = "";

async function register() {
  await fetch("/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      username: regUser.value,
      password: regPass.value
    })
  });
  alert("Registered!");
}

async function login() {
  const res = await fetch("/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      username: logUser.value,
      password: logPass.value
    })
  });
  const data = await res.json();
  token = data.token;
  alert("Logged in!");
  loadPosts();
}

async function createPost() {
  await fetch("/post", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": token
    },
    body: JSON.stringify({
      title: title.value,
      content: content.value
    })
  });
  loadPosts();
}

async function likePost(id) {
  await fetch("/like/" + id, {
    method: "POST",
    headers: { "Authorization": token }
  });
  loadPosts();
}

async function commentPost(id) {
  const content = prompt("Enter comment:");
  await fetch("/comment/" + id, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": token
    },
    body: JSON.stringify({ content })
  });
  loadPosts();
}

async function loadPosts() {
  const res = await fetch("/posts");
  const posts = await res.json();

  document.getElementById("posts").innerHTML =
    posts.map(p => `
      <div style="border:1px solid #000; margin:10px; padding:10px;">
        <h4>${p.title}</h4>
        <p>${p.content}</p>
        <small>By ${p.author}</small><br>
        ❤️ ${p.likes}
        <button onclick="likePost('${p._id}')">Like</button>
        <button onclick="commentPost('${p._id}')">Comment</button>
        <div>
          ${p.comments.map(c => `<p>💬 ${c.user}: ${c.content}</p>`).join("")}
        </div>
      </div>
    `).join("");
}

loadPosts();
</script>

</body>
  </html>
